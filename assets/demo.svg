<text x="380.0" y="24" fill="#8b949e" text-anchor="middle" font-size="12">cost-oracle — demo</text>
<text class="l0" x="24" y="56" fill="#e6edf3"><tspan fill="#7ee787">$ </tspan>cost-oracle train</text>
<text class="l1" x="24" y="77" fill="#9da7b3">Training round complete -&gt; ~/.cost-oracle/corpus.json</text>
<text class="l2" x="24" y="98" fill="#79c0ff">  claude     1,463 requests across     14 sessions</text>
<text class="l3" x="24" y="119" fill="#79c0ff">  copilot   72,604 requests across 10,331 sessions</text>
<text class="l5" x="24" y="161" fill="#e6edf3"><tspan fill="#7ee787">$ </tspan>cost-oracle estimate --provider claude --model claude-opus-5 \</text>
<text class="l6" x="24" y="182" fill="#e6edf3">    --task "Add OAuth login to a Next.js app" --budget 15</text>
<text class="l7" x="24" y="203" fill="#9da7b3">Estimate [f73ee3a7]  claude / claude-opus-5</text>
<text class="l8" x="24" y="224" fill="#9da7b3">  complexity: moderate (~72 requests)</text>
<text class="l9" x="24" y="245" fill="#79c0ff">  expected:   $9.70       range: $5.32 - $16.29</text>
<text class="l10" x="24" y="266" fill="#9da7b3">  basis:      tokens/request baseline, priced at claude-opus-5 rates</text>
<text class="l11" x="24" y="287" fill="#7ee787">  budget:     $15.00 -&gt; FITS (expected $9.70)</text>
<text class="l13" x="24" y="329" fill="#e6edf3"><tspan fill="#7ee787">$ </tspan>cost-oracle estimate --provider copilot --model claude-opus-5 \</text>
<text class="l14" x="24" y="350" fill="#e6edf3">    --task "Refactor the payment service and add tests"</text>
<text class="l15" x="24" y="371" fill="#9da7b3">Estimate [b8c0ce5a]  copilot / claude-opus-5</text>
<text class="l16" x="24" y="392" fill="#9da7b3">  complexity: complex (~70 requests)</text>
<text class="l17" x="24" y="413" fill="#79c0ff">  expected:   847.69 AIC  range: 637.70 - 1,186.27 AIC</text>
<text class="l18" x="24" y="434" fill="#9da7b3">  basis:      AIC/request from claude-opus-5 history</text>
<text class="l20" x="24" y="476" fill="#e6edf3"><tspan fill="#7ee787">$ </tspan>cost-oracle feedback f73ee3a7 --actual 11.42</text>
<text class="l21" x="24" y="497" fill="#9da7b3">  estimated: $9.70   actual: $11.42</text>
<text class="l22" x="24" y="518" fill="#9da7b3">  error:     15.0% under-estimated</text>
<text class="l23" x="24" y="539" fill="#7ee787">  calibration: x1.000 -&gt; x1.050  (future estimates adjust)</text>
